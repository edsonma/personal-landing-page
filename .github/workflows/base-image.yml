name: Build base image

# Rebuilds the Julia + Genie sysimage image only when its inputs change.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - Project.toml
      - create_sysimage.jl
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/edsonma/personal-landing-page-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
