# fly.toml — app config for edsonma's personal landing page (Genie.jl)
app = "edsonma-landing"
primary_region = "gru"  # São Paulo — closest region to Brasília

[build]

[env]
GENIE_ENV = "prod"
PORT = "8000"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
# Keep at least one machine warm. Julia + Genie have a slow cold boot
# (package loading + JIT), so scaling to zero causes the proxy to time
# out looking for a healthy candidate on the next request.
min_machines_running = 1

[[http_service.checks]]
# Give Julia real time to finish booting before the first check —
# cold boot can take 20-40s even with packages precompiled at build time.
grace_period = "60s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "10s"

[[vm]]
cpu_kind = "shared"
cpus = 1
# Bumped from 512 — Julia's base runtime + Genie comfortably needs more
# than this to avoid slow swapping during package load.
memory_mb = 1024
