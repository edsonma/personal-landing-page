# fly.toml — app config for edsonma's personal landing page (Genie.jl)
app = "edsonma-landing"
primary_region = "gru"  # São Paulo — closest region to Brasília

[build]

[env]
GENIE_ENV = "prod"
PORT = "8000"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
# Keep at least one machine warm. Julia + Genie have a slow cold boot
# (package loading + JIT), so scaling to zero causes the proxy to time
# out looking for a healthy candidate on the next request.
min_machines_running = 1

[[http_service.checks]]
# Confirmed via manual `julia app.jl` inside the running machine:
# the cold `using Genie` compile genuinely takes several minutes on
# a shared vCPU (load average ~0.7 sustained, not a hang — real JIT
# work). 120s was nowhere near enough. This only hurts the very
# first boot after a deploy; with min_machines_running = 1 below,
# it stays warm after that, so this cost is paid once per deploy,
# not per request.
grace_period = "300s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "10s"

[[vm]]
cpu_kind = "shared"
cpus = 2
# More headroom for Julia's package-loading + JIT phase at boot —
# under-resourced machines are the other common cause of this
# "refused connection" error in the Genie community.
memory_mb = 2048
