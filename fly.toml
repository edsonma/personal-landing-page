# fly.toml — app config for edsonma's personal landing page (Genie.jl)
app = "edsonma-landing"
primary_region = "gru"  # São Paulo — closest region to Brasília

[build]

[env]
GENIE_ENV = "prod"
PORT = "8000"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512
